proof_or_certificate = "**锚点 C（θe 那个量本身，先声明预测再检验）**：2026-09-17 00Z 的 282 次上升里 282 次有匹配地面层，用**同一条**已与发布场校验过的 Bolton 实现（均值偏差 +0.083 K，`scripts/thetae_check.py`，压力已参数化以免公式分叉）从**实测的地面 p/T/Td** 算 θe，与发布 `thetae850` 在同一格比对。**P1**（先声明）：850 hPa 在地下时，发布值应高于实测地面 θe —— **成立**：地下组 19 次中 **16 次**更高（中位 **+4.10 K**，范围 −6.87…+17.07），而 850 hPa 存在的 263 次里只有 121 次更高（中位 **−0.94 K**），近于掷币。**P2**（先声明）：超出量随「地面气压低于 850 hPa 的深度」单调增长 —— **成立**：分箱中位为 0..+20 hPa **+1.77**（n=4）、+20..+50 **+2.33**（n=3）、+50..+100 **+4.44**（n=4）、+100 以上 **+10.52**（n=8）。**最深五例全部顶在码本上限 357.00 K**：55299（Ps 590.2，实测地面 θe **340.33 K**）**+16.67 K**、56137（684.4，342.12）**+14.88**、56146（678.5，344.18）**+12.82**、56029（650.4，344.94）**+12.06**、55591 拉萨（655.3，348.02）**+8.98**。即「伪值占据值域顶端」这句话现在**在站点上、由实测值锚定**，而不只是两个模式场之间的比较。\n**锚点 D（预报技巧，先声明预测再检验）**：GFS `tmp2m` 对约 5,400 个测站的逐小时实测。**第一步（单 run）失败**：lead 0–5 h 的 RMSE 由 2.26 变到 2.18，**P3「误差随 lead 增长」不成立**——而原因是单个 run 下 **lead ≡ 有效时刻 ≡ 一天中的时刻**，三者完全同义，量到的是日变化而不是技巧。**第二步（多 run，混杂被解开）**：桶里除指针所指的 run 外还留着别的 run 目录，于是**同一有效时刻可以有多个 lead**。实测 **3 个 run 的 store 可读**（`2026091700`、`2026091618`、`2026091606`；另有 `2026091600`、`2026091418` 的 manifest 仍服务但 store 已 404），覆盖 **lead 0–12 与 18–24 h**（13–17 缺，因为 12Z 循环完全未保留）。逐 lead：0 h MAE **1.84** / RMSE **2.46**，1–12 h MAE **1.76–1.91**，**18–24 h MAE 1.92–2.07 / RMSE 2.59–2.78**。**配对比较有两个版本，第二个才是干净的**：第一版（时段固定、**分辨率未固定**）取最短与最长 lead，共 7 个有效时刻，得最短 lead 平均 MAE **1.808 K** → 最长 lead（24 h）**1.999 K**，增长 **+0.191 K**，7/7 个时刻都变差。**但这条曲线是混的**：三个 run **携带的分辨率档不同**——`2026091618` 只有 full（0.25°，1440×721）、`2026091606` 只有 **half（0.5°，720×361）**、`2026091700` 两档都有。lead 0–12 来自 full、18–24 来自 half，于是「增长」里混着分辨率下降。**`tier-control` 子命令在同一个 run（`2026091700`，两档都有）上直接量了分辨率代价**：同一 run、同一批小时，half 相对 full 的 MAE 代价为 **+0.137 K**（lead 0–6 上 0.120–0.159，几乎恒定）。**+0.191 K 里约 72% 由此解释。** **第二版（时段与分辨率都固定，`--tier full`）**：只用 full 档，7 个有效时刻，最短 lead（0 h）平均 MAE **1.808 K** → 最长 lead（**12 h**）**1.819 K**，增长 **+0.011 K（+0.6%）**，6/7 个时刻变差。**即：在 0–12 小时、时段固定、分辨率固定的条件下，2 m 温度误差几乎没有可测的增长。**\nscripts/anchor_check.py 的三个子命令：`underground850`（探空最低层定位 + 最近格点取样 + 两组对比）、`cellspread`（按 GFS 格点分组测站、算格内温差与海拔跨度）、`surfacebias`（测站锚，逐站偏差按海拔分箱）、`soundingbias`（探空锚，同一比较，唯一够得着高原的一组）；`scripts/thetae_anchor_and_skill.py` 的 `skill-runs`（多 run、同一有效时刻多 lead 的配对技巧比较，`--runs` 可指定 run）。结果 JSON：/tmp/anchor-850.json、/tmp/anchor-cell.json、/tmp/anchor-bias.json。"

counterexample_boundary = "它**没有**建立模式在高原上普遍偏暖。`underground850` 测的是一个**不存在的高度层**上的值与实测地面值之差——**那个层没有测量可以出错**，所以这不是「模式误差」，而是「发布值不是测量值」以及它与邻近实测的差距。真正的误差量在 `surfacebias` 里，而它给的是 **−0.40 K**，即**低平处几乎无偏**。**高原那一格现已用探空锚补上，但要说清它是什么**：测站锚在 ≥2000 m 只有 102 站且几乎全在安第斯与北美西部；高原的数来自探空锚（高原框 n=23，sd **4.38 K**，逐站 −5.6…+11.1 K）。它是**同一时刻、单个时次、23 个点**的数，且它的**符号与量级主要由「站点海拔 vs 格点平均海拔」决定**——所以它量化的是**点对格点比较在这个地形区制下能有多离谱**，不是一个可以加到模式上的偏差订正。它**没有**把「格点平均海拔」真正算出来：本 claim 用的是「符号与该差一致」这一判读，**没有**用一份高程数据把每站的格点平均海拔量出来做回归。它**没有**分开模式误差与代表性误差：「代表性天花板」测的是中位 1.0 K，但那只在 243 个**低平**格点上测到，**陡峭地形下该天花板必然更大而本轮未测到**。它**没有**建立这些数字在别的时刻、别的季节成立：一个时次、一次运行、一天。它**没有**检验除 `tmp2m` / `tmp850` / `tmpsfc` 以外的任何变量——`prmsl`、`dpt2m`、`thetae850` 都未与锚点比对。它**没有**检验 thetae 本身：本条锚定的是**机制**（850 hPa 在高原不存在），不是 θe 那个量的数值。\n**θe 那一格的边界**：P1/P2 建立的是「发布值与实测值之间的距离及其随深度的趋势」，**不是「发布值错了」**——850 hPa 在地下没有实测 θe 可以出错；也不建立 Bolton 是唯一正确的约定（用的是与本仓库已校验实现相同的那一条，好处是不会有公式分叉，代价是它不是第二条独立路径）。地下组只有 **19 次**上升，分箱后每箱 3–8 个，**P2 的单调性建立在每箱个位数样本上**。\n**预报技巧那一格的边界**：**干净的那一版只到 12 h**——full 档只有两个 run（`2026091700` 覆盖 0–6 h、`2026091618` 覆盖 0–12 h），所以「0–12 h 无可测增长」是这一格的结论边界；**13–17 h 的洞**来自 12Z 循环完全未保留（逐小时回探 144 个候选，只有 5 个 manifest，其中 1612 连 manifest 都没有），**补不上**。配对只有 **7 个有效时刻**且全落在 09-17 00–06Z，「时段固定」实际是固定在这 7 小时。**+0.011 K 不是斜率**，是这些 lead 对之间的平均增长，未建立增长是否线性。half 档的那条（0–24 h，+0.191 K）**已被判定为混入分辨率变化，不再作为技巧证据**。它**没有**把误差分解为模式误差与代表性误差（低平处格内天花板中位 1.0 K、高原 sd 4.38 K）。"

forbidden_conflations = [
