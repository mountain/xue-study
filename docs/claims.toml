counterexample_boundary = "**本 claim 没有建立公式有错——恰恰相反**：均值偏差 +0.109 K 说明 `derive_theta_e` 是对的。它**没有**建立 357 K 这个上限对真实气象太低：暖池独立算得的上界约 364 K，7021 个点里只有 0–4 个顶到上限，所以上限对真实场只是勉强够用。它**没有**建立「提高上限就能修好」——提高上限只会把**更多外推伪值**映射进值域。渲染后果**已建立**（截图，见 `proof_or_certificate`）。它**没有**建立观看者会把它读成错误——那是 UX 判断。**机制已在第二个变量上向前检验**（`scripts/plateau_mechanism_check.py`，同一 run，地面温度对同纬度非高原区的异常）：`tmp925`（约 762 m，在地下）**+6.33 K**、`tmp850`（约 1458 m，在地下）**+5.16 K**、`tmp500`（约 5575 m，在地面之上）**+2.05 K**。地下两层的大幅偏暖与机制一致；500 hPa 的 +2.05 K 明显更小但**不为零**，而高原夏季本身是热源、其 500 hPa 近地面，这一点未被排除。**判据里那个 2 K 阈值是我自己定的，二值判语不如上面的梯度可靠。** 500 hPa 那 +2.05 K 的**判别性检验已做、未决**：`hgt500` 异常为 **−58.40 gpm**（**更低**，但被地形混淆——高原下方是岩石不是空气，同纬度对照是低地气柱），`vvel500` 显示微弱上升（−0.04 Pa/s）但**分母近零、比值无意义**；另有一个同方向的新信号：`rh500` 高原 **69.47%** 对同纬度 **33.49%**。**该残余现已解决**：用已发布的位势高度场判别比较是否对等——`hgt500` 在两区域相差 58.4 gpm（5894.2 的 1.0%）、`hgt250` 相差 3.3 gpm（0.03%），**即这两层的绝对高度几乎相同，温度比较是对等的**，故 +2.05 K 是**同高度上的真实偏暖**，不是几何假象；而 850 hPa 虽绝对高度也接近，其在高原上位于约 4500 m 地面之下约 3 km，**那才是外推的那一层**。结论回到机制本身：**伪值特指位于当地地面之下的层次**。**逐格点检验已完成**（`scripts/plateau_profile_check.py`，用 Copernicus DEM GLO-90 实测每格高程：高原框内均值 **4140 m**，而此前写的是假设值约 4500 m）：把整框均值换成『按离地高度分箱』后得到**剂量–反应关系**——`tmp850`：离地 −4000~−3000 m 时 **+6.73 K**、−3000~−2000 m 时 **+3.76 K**、−2000~−1000 m 时 **+0.49 K**、−1000~0 m 时 **+0.45 K**；`tmp500`（全部在地面之上）：500~1500 m 时 **+2.72 K**、1500~3000 m 时 **+0.84 K**。**一个机制解释了两件事**：在地下越深偏暖越强（外推），刚出地面则受地面加热（真实但不属于外推）。**θe 自身也已逐格点检验**（`scripts/thetae_profile_check.py`，上限 357.0 K 从发布元数据读出而非硬编码）：顶在上限的格点占比同样是离地高度的单调函数——−4000~−3000 m 时 **61.8%**（215/348）、−3000~−2000 m 时 **31.5%**（162/514）、−2000~−1000 m 时 **13.4%**（9/67）、−1000~0 m 时 **0.0%**（0/13）。**与温度的剂量–反应在同一组分箱上同向**（温度 +6.73/+3.76/+0.49/+0.45 K），两个独立变量给出同一条曲线。注意：本检验用的是**帧 0**，而前述『整框 62–66%』来自帧 40 与 160，两者未在同一帧上对齐，**不可直接比较**；逐格点的曲线取代了那个单一整框数字作为该 claim 的证据。**参照系与前一版不同**：此处用该纬度**整圈**的平均作对照，而非『同纬度带内排除高原框』。θe 本身仍只发布了 850 hPa 一层，所以换层次无法检验；换调色板的表现未检验。它**没有**建立编码器不知道这件事：它**为每个变量都统计了截断点数**（`binconvert.py:1225`），只是报告里只输出 `tmp2m` 与风场两项。**机制的最新一环由探空独立坐实