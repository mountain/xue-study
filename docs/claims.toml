# xue 的 claim 注册表
#
# 这个文件是"把 Adva 的学习引入 xue-study"的**证伪测试**：先只注册两个 claim，
# 强制填写 Adva 的 `counterexample_boundary`（本 claim 没有建立什么）与
# `forbidden_conflations`（哪些混淆是被禁止的）。
#
# 判据（我自己先立的）：如果写出来的东西只是把报告 §11「诚实的局限」换个说法复述，
# 这次引入就是装饰性的，应当放弃。
#
# 结论：**没有放弃**。填写这两个字段产出了 5 件报告里没有的东西，其中一件是
# 我自己的实验有洞（见 `xue.store.per-array-chain-interop.v0` 的 `assumptions`）。
#
# 现已扩到 8 条（格式/交付 4 条、前台 1 条、派生量 1 条、雷达 2 条）。
# 扩张中又撞到一处过度声称：我本来要注册
# `xue.delivery.exact-reproduction.v0`，写 `scope` 时才发现我核对的只是
# **根文档的 CRC-32 与总字节数**，并没有下载线上 shard 逐字节比对——
# 于是改名并把它写进 `counterexample_boundary`。
#
# 一条纪律（沿自 Adva："无检查之处就明说没有检查，claim 不作"）：
# **未测量的观察不进这张表。** README §三 里"探空的代价"是从注册表结构推出的，
# 因此它留在 README 中并标注为未测量，而不是注册成 claim。
#
# 与 Adva 的差异：Adva 的注册表由 Rust 的语义权威背书，每条 claim 指向可执行的 checker。
# 这里的 claim 指向我写的脚本，且**没有任何一方被指定为权威**——这本身就是待决问题。

schema_version = 1

[[claim]]
claim_id = "xue.delivery.production-artifact-reproduction.v0"
canonical_name = "从源 GRIB 重建的 Zarr store，与线上发布产物的根文档 CRC-32 和总字节数完全相同"
code_symbol = "scripts/measure.py; docs/xue-verification-report.md"
dimension = "交付字节 / GFS 2026091600 / profile balanced / 全分辨率"
status = "bounded-measurement"

scope = "GFS pgrb2.0p25，run 2026091600，`--hours 240`（161 帧，1440×721），`--profile balanced`，`--bundles tmp2m prate`，经原生编码器（`XUE_ENCODER=native`）构建。与线上 manifest 的 `zarr` 描述符比对：`tmp2m.zarr` 重建为 40,643,714 字节、根文档 CRC-32 `7d18ca5f`，线上为 40,643,714 / `7d18ca5f`；`prate.zarr` 重建为 46,745,894 / `4f988fff`，线上为 46,745,894 / `4f988fff`。两者的字节数与 CRC-32 均相同。"

assumptions = [
  "线上 manifest 的顶层 `zarr` 描述符描述的是**全分辨率** store；`variants[].zarr` 描述的是半分辨率档。比对用的是顶层那个。",
  "store 的 `?v=` 是它根 `zarr.json` 的 CRC-32——这是 manifest 记录的东西，也是本次比对的量。",
  "**核对的是两件事：总字节数，与根文档的 CRC-32。** 线上 shard 对象**没有下载、没有逐字节比对**。生产 run 会被清理，比对时该 run 的部分对象已返回 404，因此当时也无法取全。",
  "重建使用的 profile（`balanced`）与线上一致。先用默认 `quality` 构建时 `tmp2m` 差 1 字节——那恰好是元数据 JSON 里 `\"quality\"`(7) 与 `\"balanced\"`(8) 的字符数之差；`tmp2m` 的码本在两个 profile 下相同，所以只差这 1 字节，而 `prate` 差 14.2%。",
]

dependencies = ["xue.store.container-byte-identity.v0"]

proof_or_certificate = "measure.py 与 xue-verification-report.md §3 的构建/比对步骤，运行于 /tmp/xue-upstream 的上游克隆。"

counterexample_boundary = "这**不是**对所有对象的逐字节复现。相同的总字节数与相同的根文档 CRC-32 是一致的，但不是每个 shard 都相同的证明：shard 从未被下载比对。它覆盖一次 run、两个变量、一个 profile、一个分辨率档。它**没有**建立容器 `.xue` 的体积——线上已不发布容器，报告里给出的容器体积是从 manifest 的 `bandwidth`（一个 12 fps 下的 HLS 式比特率）**反解**出来的，那是推算不是观测。它也没有建立任何源在 GFS 之外的行为。"

forbidden_conflations = [
  "总字节数相同 —— 与 —— 每个对象逐字节相同",
  "根文档 CRC-32 相同 —— 与 —— store 的内容相同（CRC 只覆盖那份文档，而它确实覆盖每个数组的元数据）",
  "由 `bandwidth` 反解出的容器体积 —— 与 —— 观测到的容器体积",
  "一次 run 上的复现 —— 与 —— 流水线的确定性（两次构建给出同一串字节，只说明这两次）",
  "发布产物可复现 —— 与 —— 发布产物正确（复现不检验物理量，见 claim 里对降水的警告）",
]

[[claim]]
claim_id = "xue.store.container-byte-identity.v0"
canonical_name = "容器 chunk 与 store inner chunk 在布局重合处压缩字节完全相同"
code_symbol = "scripts/verify.py; docs/xue-verification-report.md"
dimension = "压缩字节 / GFS 2026091600 / 161 帧全轴 / 容器 v2 vs Zarr store"
status = "bounded-measurement"

scope = "8 个全轴 bundle（tmp2m, prate, prmsl, rh850, cape, tcdc, wind10m, htsgw），161 帧，1440×721，tile 48×52，profile balanced。每个数组 11,340 个 chunk，其中 7,800 个「可比」——即与某个容器组起始帧相同、长度相同、且瓦片未被裁剪。我自己的读取器（两侧索引均按规范手写）逐块比对：delta 链下预测变量 7800/7800 字节完全相同；标准链下 RAW 变量 7800/7800；标准链下预测变量 0/7800（符合规范所述的条件）。wind10m 两个数组为 15,600/15,600。"

assumptions = [
  "「可比」是本次研究按规范独立实现的判据，不是调用导出器自己的记账；两者在都跑到的变量上一致（均为 7800）。",
  "在 161 帧轴上只有 7,800/11,340 个 chunk 可比：GFS 在 f120 处由 1 小时步长转为 3 小时，容器的 28 个组与 store 固定的 6 帧时间网格从第二段起整体错位，一个都对不上。这是规范写明的 \"coincide up to the first change of step\"。",
  "比对用同一套 zstd 设置（level 15 + 内容校验和），因为字节相等本身依赖于两侧用同一套。**项目自带的反例**：`tests/fixtures/generated/web/` 里 `tmp2m.xue` 的容器用 zstd **level 3** 写（`tests/prepare_web_fixture.py:211`，注释写明 keep fixture generation fast; the contract is level-independent），而 `tmp2m.delta.zarr` 用默认 level 15 导出——两者的**码逐帧相同**（121/121），**压缩字节无一相同**（720 个可比块全不同，且 store 的块一致更小）。这个 claim 只覆盖「同一套设置」的前提。",
]

dependencies = []

proof_or_certificate = "verify.py 的 (a)(b)(c) 三项：逐帧与 Rust 解码器比对、逐块字节比对、shard 索引 CRC-32C 校验（11,340 条）。运行于 /tmp/xue-upstream，用 /tmp/xue-verify/bal 与 bal-delta 的构建产物。"

counterexample_boundary = "**字节相同不等于构造相同。** 两串相同的字节来自两条不同的代码路径——一边是编码器的组，一边是从容器读回后再切块——而字节相等不建立相同的历史、相同的来源或相同的意图。本 claim 也不覆盖被裁剪的瓦片、不与容器组重合的时间块（161 帧轴上占 26%），也不覆盖容器 v1 的导出路径。它只覆盖 GFS。它没有建立**解码后的码**相同之外的任何语义等价：容器里的码与 store 里的码相同，不说明读出来的物理量正确（降水正是反例，见 `xue.delivery.production-artifact-reproduction.v0`）。它也**没有**被用来证明 store 优于容器或反之。"

forbidden_conflations = [
  "压缩字节相同 —— 与 —— 构造相同、来源相同、历史相同",
  "可比的 7,800 个 chunk —— 与 —— 全部 11,340 个（其余因变步长错位或瓦片被裁剪而不可比）",
  "码相同 —— 与 —— 物理量正确（降水用 log1p 码本，CF 无对应拼写）",
  "在布局重合处的相等 —— 与 —— 两种承载方式等价",
  "我用独立判据得到 7800 —— 与 —— 该判据就是规范定义的唯一判据（它是本次研究的实现，虽与上游记账一致）",
]

[[claim]]
claim_id = "xue.predictor.per-variable-preference.v0"
canonical_name = "在 GFS 上，多数已发布变量用 store 的 RAW 链比用容器的 PREVIOUS 规则压得更小"
code_symbol = "scripts/predictors.py; docs/xue-verification-report.md"
dimension = "压缩字节 / 单个六帧时间块 / GFS 0.25°"
status = "bounded-measurement"

scope = "GFS pgrb2.0p25，run 2026091600，profile balanced，全部 37 个 bundle（43 个变量）。对每个变量：取轴上索引 0–5 这六帧、1440×721 网格的全部 420 个瓦片，经 Rust 解码器读出量化码，每个瓦片压两遍——整块一次、与前帧的模 256 差分一次——均为 zstd level 15 带内容校验和，求和比较。结果：20 个变量残差更小，23 个变量 RAW 更小。"

assumptions = [
  "所测的六帧代表整条轴。这一点**已知至少对一个变量不成立**：`rh850` 在这个块上测得 0.969（残差更小），在 161 帧全轴上测得 1.004（RAW 更小），两者符号相反。",
  "zstd level 15 带内容校验和复现了 store 实际写入的设置；容器写入的设置相同。",
  "13 帧构建与 161 帧构建对同一变量量化出相同的码：量化是逐帧的，码本按变量与 profile 固定。",
  "Python 3.14 的 stdlib zstd 与 zstd CLI 在解码上可互换、在编码上不可互换；本次比较全部在同一侧完成，因此比值内部自洽，但**不可迁移**到另一侧构建出的产物。",
  "家族划分（云量 / 气压 / 垂直速度）是本次研究在看到结果之后做的分类，不是登记在案的变量分类。",
]

dependencies = []

proof_or_certificate = "predictors.py，运行于 /tmp/xue-upstream 的上游克隆（HEAD 8af4376）。方向另经一次独立复核：另写脚本对帧 30–35 的全部 420 个瓦片用相同设置重压一遍，7 个变量中 6 个方向一致，`rh850` 分歧 1.4%。"

counterexample_boundary = "本 claim 是关于**压缩字节**的，不是关于**容器的规则错了**。容器对每个线性码本变量施加 PREVIOUS，是因为 `docs/format.md` 把它写成一条规范性的编码器规则，其作用是把两条编码路径锁成字节一致——它是规范，不是压缩启发式，压得更小并不使它成为错误。全语料的**幅度**没有被建立：43 个变量中只有 8 个在 161 帧全轴上测过，别处引用的合计节省量依赖由这 8 个得出的 0.406 标定系数。GFS 以外的任何源都没有被建立。**是否应当改动**没有被建立：store 是前端与第三方客户端读的东西，而逐数组链的代价不在本 claim 的范围内（见 claim 2）。为云量提出的机制解释（移动的不连续面）是**另一条更弱的 claim**，仅由 7 个变量的一个时间块支持。"

forbidden_conflations = [
  "压缩机在某个块上输出更小 —— 与 —— 格式的编码器规则是错的",
  "六帧块的比值 —— 与 —— 整个 store 的比值（`rh850` 在两者上符号相反）",
  "单个时间块上的偏好 —— 与 —— 跨步长变化整条轴上的偏好（GFS 在 f120 前 1 小时、之后 3 小时，残差收益随步长变化；这正是三种采样全部失手的原因）",
  "某个变量测得的偏好 —— 与 —— 某个家族的偏好（家族划分是事后做的）",
  "更小的 store —— 与 —— 更省的交付（项目自己的交付度量是 `bandwidth`，一个 12 fps 下的 HLS 式比特率，不是字节数）",
  "更小的 store —— 与 —— 对某个读者根本打不开的 store（读者缺少的链不是「小一点」，是「打不开」，见 claim 2）",
  "一次测量 —— 与 —— 一条建议（由这次测量引出的建议已被撤回）",
]

[[claim]]
claim_id = "xue.store.per-array-chain-interop.v0"
canonical_name = "store 中只要有一个数组使用 xue.delta 链，未注册该 codec 的客户端就**完全打不开这个 store**，与其余数组用什么链无关"
code_symbol = "scripts/interop.py; docs/xue-verification-report.md"
dimension = "客户端可读性 / zarr 3.3.0 + xarray 2026.7.0 / 双变量 store"
status = "bounded-measurement"

scope = "zarr 3.3.0 与 xarray 2026.7.0，在由同一个 161 帧 `wind10m` bundle 导出的 store 上：① 整包标准链；② 整包 delta 链；③ 由 `export_bundle(delta=\"auto\")` 逐数组决定；④ 手工构造的自洽混合 store（`ugrd10m` 标准、`vgrd10m` delta，分组文档与其数组一致）。每种各在**独立进程**中、分别在注册与不注册 `xuebuild.zarrcodec.register()` 的情况下调用 `zarr.open_group(store)` 与 `xarray.open_zarr(store)`。"

assumptions = [
  "四个 store 承载相同的码，只有内层链不同。",
  "zarr-python 是**一个**客户端；zarrs 与 zarrita 未测。",
  "本 claim 的**第一版证据是无效的**：当时那个「混合」store 是用 `--delta auto`（两个数组都判 delta）导出后覆盖掉 `ugrd10m/` 得到的，**没有同步重写分组文档里的 consolidated metadata**，所以文档声明两个数组都是 delta，与磁盘上的数组不符。结论侥幸正确，证据无效。v0 已用 `tests/prepare_mixed_fixture.py` 生成的自洽夹具重做，并逐字核对了分组文档与磁盘一致。",
  "混合 case 使用了 zarr 默认的 `use_consolidated=True` 路径；分组文档是 zarr-python 实际读取的东西。",
]

dependencies = ["xue.predictor.per-variable-preference.v0"]

proof_or_certificate = "interop.py 的四格矩阵。整包标准链：不注册即 open_group 成功、坐标可读、两个数组可读、`xarray.load()` 载入全部 334,313,280 个值。整包 delta 与自洽混合：不注册时均在 `open_group` 抛 `UnknownCodecError: Unknown codec: 'xue.delta'`。注册后三种均成功。前端的对应行为另由 `tests/web/zarr-mixed.test.ts`（4 个测试，均已通过）覆盖：混合 store 对**自带解码器**的前端可逐字节解出两个数组。"

counterexample_boundary = "本 claim 是关于**可读性**的，不是关于完整性或正确性的：失败发生在打开阶段，与数据是否损坏无关。它没有建立 zarr-python 之外的客户端的行为，也没有建立「某个读取路径可以绕过」——即没有测试是否有客户端把 codec 解析推迟到访问单个数组时，从而给出部分可读的结果。它没有在**线上** store 上验证（线上 37 个 bundle 全部是标准链，所以线上没有混合实例）。它没有度量代价的大小——本 claim 只说明代价是**全有或全无**，不说明它值多少字节。它也没有建立「因此不应当采用逐数组链」这个结论：那是 claim 1 与 claim 2 合起来才支持的推论，且依赖于项目把生态可读性排在其目标列表的什么位置。"

forbidden_conflations = [
  "分组文档的声明 —— 与 —— 数组在磁盘上的实际链（本 claim 第一版正是在这里出的错）",
  "一个数组不可解 —— 与 —— 只有那个数组不可读（整个 group 打不开）",
  "zarr-python 的行为 —— 与 —— Zarr 生态的行为",
  "注册 codec 之后可以打开 —— 与 —— 没有代价（注册是使用方必须做的事，而这正是项目把默认链定为标准链的全部理由）",
  "打开失败 —— 与 —— 数据损坏",
  "线上没有混合实例 —— 与 —— 混合形态不被支持（线上全是标准链，所以这条路径在线上根本没有被走过）",
]

[[claim]]
claim_id = "xue.frontend.mixed-chain-session.v0"
canonical_name = "自带解码器的前端能把混合 codec 链 store 的两个数组逐字节解出"
code_symbol = "scripts/prepare_mixed_fixture.py; scripts/zarr-mixed.test.ts; docs/xue-verification-report.md"
dimension = "前端解码路径 / 单元层 / jsdom"
status = "bounded-measurement"

scope = "上游克隆中新增的 4 个测试（`npx vitest run tests/web/zarr-mixed.test.ts`，4/4 通过；全量前端单测 27 个文件 408 个测试通过）。夹具是一个自洽的混合 store：`ugrd10m` 走 `[bytes, zstd]`、`vgrd10m` 走 `[xue.delta, bytes, zstd]`，由 `prepare_mixed_fixture.py` 从同一个 `wind10m.xue` 导出拼装，并把分组文档的 consolidated metadata 重写为与实际数组一致。解码走真实的 `ZarrSession` / `ZarrStore` / `localFetch` 与真实的 WASM `decodeChunk`；逐帧比对 7 个偏移（含块边界 6 与轴上最后一帧），逐序列比对每个数组 3 个格点（含被裁剪的最后一格）。"

assumptions = [
  "夹具的分组文档与磁盘上的数组**逐字一致**——这正是 `xue.store.per-array-chain-interop.v0` 第一版证据缺失的那一步。",
  "运行环境是 jsdom，不是浏览器；WASM 模块被真实加载（`xue_bg.wasm`），但没有任何渲染发生。",
  "只覆盖一个双变量 bundle（wind10m）。",
  "`ZarrSession.open` 逐数组读取 `<id>/zarr.json`，不使用分组里的 consolidated metadata；这与 zarr-python 的默认路径不同。",
]

dependencies = ["xue.store.container-byte-identity.v0"]

proof_or_certificate = "4 个测试：链确实一数组一条；会话能打开且保留逐数组 layout；两个数组每一帧与容器解码逐字节一致；两个数组的格点序列与容器逐字节一致。"

counterexample_boundary = "这是**单元层**结论。它**没有**建立页面能播一个混合 store：worker（`zarr/worker.ts`）、manifest 校验、投递路径选择、WebGL 渲染都不在这条路径上，也没有跑过真实浏览器。它**没有**建立线上会走这条路径——线上 37 个 bundle 全是标准链，混合形态线上从未出现。它**没有**度量代价，也不支持「混合链应当发布」这个结论：`xue.store.per-array-chain-interop.v0` 表明代价对第三方读者是全有或全无。它只覆盖一个双变量 bundle 与一个固定的瓦片几何。"

forbidden_conflations = [
  "单元测试通过 —— 与 —— 页面能播",
  "组件层能解 —— 与 —— 线上会走这条路径（线上全是标准链）",
  "自家前端能解 —— 与 —— 应当发布混合链",
  "与容器解码逐字节一致 —— 与 —— 渲染正确",
  "测试里的 `localFetch` —— 与 —— worker 的真实 HTTP 路径",
]

[[claim]]
claim_id = "xue.derived.theta-e-plateau-clamp.v0"
canonical_name = "发布的 850 hPa 相当位温在青藏高原大面积顶到码本上限，使高原在值域上比热带暖池更极端；根因是 850 hPa 在高原上是地下外推"
code_symbol = "scripts/thetae_check.py; scripts/screenshot.mjs; docs/xue-verification-report.md"
