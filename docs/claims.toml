[[claim]]
claim_id = "xue.radar.absence-not-marked-in-band.v0"
canonical_name = "CMA 拼图的 cref 码本声明了 nodata 码却从不写入，无雷达处被填成 0 dBZ；覆盖边缘参差且不随产物发布，因此任何跨边界的回波占比都不是面雨量占比"
code_symbol = "scripts/radar_coverage_check.py; scripts/radar_vs_model_check.py; docs/xue-verification-report.md"
dimension = "值域语义与覆盖 / CMA-RADAR cref / 2026-09-17 01:00–04:06Z 合并窗口"

status = "bounded-measurement"

scope = "**码本**：`cref` 的 `quantization` 为 `minimumCode 0`、`maximumCode 160`、`scale 0.5` dBZ/码、`nodataCode 255`；zarr 数组 `fill_value` 亦为 255。**实测**：合并窗口共 **40,370,176** 个样本，观测到的码值范围 **0–139**，码 255 出现 **0 次**。**覆盖判决**用一份独立场（GFS `prate`，run 2026091618，0.25°）在同一时段做参照，先在两个物理上没有争议的参照系上校准方法的读数：射程外（中国雷达约 230 km）**孟加拉湾** 85–92E/15–20N 雷达回波格点 **0.0%** 而模式报雨 **45.2%**；**阿拉伯海** 68–74E/12–18N 雷达 **0.0%**、模式 **89.8%**——两者的命中率（模式报雨格点中被雷达看到的比例）都是 **0.000**。密集覆盖的**华东**对照 110–122E/25–35N 雷达 **81.2%**、模式 **56.4%**、命中率 **0.844**、回波占比与模式雨强的 Pearson r 为 **0.420**。「模式报雨而雷达从未看到」的比例：华东 **8.8%**、华北 **1.1%**、孟加拉湾 **45.2%**、阿拉伯海 **89.8%**。**边缘位置**：80–92E 经向上，26–27N / 27–28N / 28–29N 三带雷达回波均为 **0.0%**（模式分别 81.8% / 94.8% / 74.0%），到 29–30N 骤升为 **10.4%**（r = 0.507），30–31N **6.2%**（0.322）、31–32N **10.9%**（0.554）、32–34N **2.1%**（0.265）——**29°N 处是一个陡台阶**。**回波真实性**：喜马拉雅框（80–92E/26–32N）内，回波像元有 **74.5%** 落在 ≥25 格的 4-连通斑块中、单帧即消失的格点仅 **9.4%**、逐格最长连续帧数中位数 **5.0**、相邻帧 IoU **0.642**、p90 **43 dBZ**、最大 **88 dBZ**——与华北真降水对照（74.4% / IoU 0.581 / p90 34 dBZ）同级。**判据**：把「回波是否相干」当作降水与伪回波的判别式是**先在一组已知伪回波上校准过**的——南海 110–118E/12–18N 落在雷达射程之外，却是唯一一个高 p90（76 dBZ）而大斑块占比仅 **20.1%**、IoU **0.374**、单帧格点 **36.3%** 的方框。"

