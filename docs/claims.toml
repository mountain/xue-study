scope = "**锚点 A（探空，够得着高原地形）**：2026-09-17 00Z 全球上升，492 站中 **282 次**上升有一层的报告高度落在站点海拔 ±150 m 内（用于定位地面层）；其余 **44 次判为残缺上升**（只报平流层段，无层接近站点海拔）。**850 hPa 在地面之下**（地面气压 < 850 hPa）的有 **19 次**：模式 `tmp850` 减去**该次上升实测的地面温度**，中位 **+9.50 K**、均值 +8.34 K、范围 −1.70…+21.20 K，**18/19 更暖**，且 **19/19 比模式自己的 `tmpsfc` 更暖**。**850 hPa 存在**的 **263 次**：同一差值中位 **−6.30 K**、均值 −5.63 K，仅 29/263 更暖。两组干净分离。最清晰的一例是 **55299**（31.5N/92.1E，海拔 **4508 m**，地面气压 **590.2 hPa**）：实测地面 **+1.3 °C**，模式 `tmpsfc` **+2.5 °C**（与实测差 1.2 K），而模式发布的 `tmp850` 是 **+22.5 °C**——**比那里实测的空气暖 21.2 K**。其余高原站同向：52836（3190 m）+15.8 K、56029（3717 m）+13.8 K、56137（3307 m）+13.7 K。\n**锚点 B′（探空锚点的地面温度，唯一够得着高原的一组）**：同一 00Z 帧，**282 次上升**的实测地面温度对模式 `tmp2m`——全体中位 **−0.15 K**、均值 +0.18 K、sd 2.74 K。按海拔分箱：<500 m 中位 −0.20 / sd 2.19（n=221）、500–1500 m **+2.10** / 3.59（n=43）、1500–2500 m −0.70 / 3.70（n=10）、2500–3500 m **−3.00** / 4.19（n=5）、**≥3500 m −4.20 / 2.87（n=3）**。**青藏高原框（75–105E, 25–40N）：n=23，中位 −0.20 K、均值 +0.82 K、sd 4.38 K**——逐站极值：56146（3394 m）**−5.6 K**、55591 拉萨（3650 m）**−5.4 K**、56029（3717 m）−4.2 K，而 52983（1875 m）**+8.6 K**、51777（889 m）**+11.1 K**。**符号由「站点自身海拔与所处 0.25° 格点平均海拔之差」决定**：谷中站比格点暖、峰上站比格点冷。这就是 round-3 卡里「0.25° 温度在深谷-高峰上的偏差未量化」那条残余——**本条现已给出该数（高原框 sd 4.38 K、逐站 −5.6…+11.1 K），并说明它是地形代表性而非模式误差项**。\n**锚点 B（测站，覆盖低平地形）**：同一 GFS 场，2026-09-17 05Z 帧，**5,354 个机场站**的实测 `t` 与模式 `tmp2m` 逐点比对：全体中位偏差 **−0.40 K**、均值 −0.44 K、1 个标准差 **2.62 K**。按站点海拔分箱：<100 m 中位 −0.50 K / sd 2.23 K（n=2221）、100–500 m −0.30 / 2.48（n=2027）、500–1000 m 0.00 / 3.43（n=559）、1000–2000 m 0.00 / 3.34（n=445）、**≥2000 m −0.50 / 4.17（n=102）**。\n**代表性天花板**：5,076 个被占用的 0.25° 格点中，**243 个**含 2 站以上。同一格内两站实测温度之差：中位 **1.00 K**、均值 1.40 K、90 分位 **3.00 K**、最大 12.00 K；**19%** 的格点内站间差超过 2 K。其中 25 个格点的站间海拔跨度超过 100 m，跨度中位 144 m——按 6.5 K/km 递减率只对应 0.94 K。"

