scope = "GFS run 2026091618，半分辨率 store（361×720，161 帧），抽查帧 0/40/80/120/160。`thetae850` 的码本为 230.0–357.0 K（offset 230、scale 0.5、maximumCode 254）。用发布的 `tmp850` 与 `rh850` **独立**算 q（Magnus 饱和水汽压）再按 Bolton (1980) 算 θe，与发布的 `thetae850` 比对：全样本平均偏差 **+0.109 K**。但发布场在**每一帧**的上界都恰为 357.00 K。在青藏高原框（80–100°E, 27–38°N）内，**62%–66%** 的格点顶在上限；在西太平洋暖池框（120–180°E, 15°S–15°N）内是 **0–4 / 7021**。"

assumptions = [
