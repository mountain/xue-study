  "回波方框用的是经纬度框，不是地形掩膜；「山脊」是从 29°N 台阶这一步长做出的**地理判读**，没有叠地形数据核对。",
  "**原始输入不可再取**：本条 claim 的全部读数取自两个已被驱逐的窗口目录。已用当时可读的四个窗口重测（见 proof_or_certificate 中的对照表），结构与量级均保持，但**重测用的不是同一批字节**，故这是可复现性的替代而非复现。",
  "两次测量的窗口长度不同（30 帧对 34 帧，跨度 3h06m 对 3h42m），叠加的雷达帧数相差约 13%。",
