# 物理正确」。这一条是第一次拿**实测值**去检验**交付的栅格场**：
# 上升报告了它在某地实际测到的气压/高度/温度，机场报告了它实际测到的温度。
#
# 集合是互补的，这一点是本条的关键：测站网络密在低平与人口密集处（全球只有
# 23 个站 ≥3000 m，青藏高原框内一个都没有），而**探空才够得着高原地形**——
# 恰恰是 θe 那条 claim 出问题的地形区制。两个锚集覆盖的地形区制几乎不相交。
# ---------------------------------------------------------------------------

