  "「青藏高原」与「暖池」用的是粗略经纬度框，不是地形掩膜。",
  "850 hPa 在高原上是地下，是从高原平均海拔（约 4500 m）**推断**的，没有用地形数据集核对。",
  "**首个假设已由一族独立数据换成观测（2026-09-17）**：原假设是「850 hPa 在高原上是地下，从高原平均海拔（约 4500 m）推断，没有用地形数据集核对」。探空产品（`sounding`，WIS2 TEMP 公报）给出**实测的逐层气压**：青藏高原框（75–105E, 25–40N）内 **6 个站**（海拔 3190–4508 m），其 **24 次上升里没有一次的最高气压达到 850 hPa**——最高的那次到 **590.2 hPa**（站 55299，海拔 4508 m），拉萨 55591 到 **655.3 hPa**，即 850 hPa 在地面之下 **195–260 hPa**。且产品**自己拒算**依赖该层的派生量：这 24 次上升的 `derived.lapse850_500` **全部为 null**。这不是我的推算，是产品在自己的字段里承认那里没有 850 hPa 层。",
  "**机制已由实测值直接锚定（不只是由另一个模式变量间接支持）**：2026-09-17 00Z 探空，55299 站（海拔 4508 m、地面气压 590.2 hPa）实测地面 **+1.3 °C**，模式 `tmpsfc` **+2.5 °C**（差 1.2 K），而模式发布的 `tmp850` 是 **+22.5 °C**——**比实测空气暖 21.2 K**。地面气压低于 850 hPa 的 19 次上升里，`tmp850` **18 次**高于实测地面温度（中位 +9.50 K）；而 850 hPa 存在的 263 次里中位是 **−6.30 K**（正确地更冷）。两组干净分离，见 `xue.anchor.field-against-measurement.v0`。**注意这仍不是「模式误差」**：那个层没有测量可以出错；它建立的是「发布值不是测量值」。",
  "上述探空的**站点稀疏**：高原框内 6 个站、24 次上升，覆盖 2026-09-15 12Z 至 2026-09-17 00Z；测站（airport）产品在该框内最高的站只有 3256 m（VILH 列城），**没有任何测站高于 3300 m**，故高原的站级观测实际只有探空一条路。",

